<!-- =====================================================================
     BMN · LIQUID GLASS REELS  —  community video suite  (v1.0.0)
     ---------------------------------------------------------------------
     WHAT IT IS
       A self-contained module (CSS + markup templates + vanilla JS) that adds a
       TikTok-style experience to the Community Page without touching your
       header, footer, dock or existing scripts.

     HOW IT PLUGS IN
       • Adds ONE glass launcher card (stories + "Reels" button) inside
         .community-center, only while body.community-mode is active.
       • Tapping it opens an immersive layer (z-index 10300) containing:
         For You / Following feed · momentum vertical swipe · double-tap like ·
         comments + keyword search · share tray · stories + LIVE rings · DMs ·
         profile (with the BMN Page anchored to it) · settings drawer.
       • Everything is namespaced lgtt-* ; the only global is window.LGTT.
       • Remove the whole block between BEGIN/END markers to uninstall.

     OPEN FROM ANYWHERE
       <button data-lgtt-open="feed">Reels</button>   (feed | discover | profile | inbox)
       LGTT.open() · LGTT.openStory('kele') · LGTT.openProfile('bmn') · #reels in the URL

     USE YOUR OWN DATA  (define before this block, or call later)
       window.LGTT_CONFIG = { profile:{ followers:1234 }, posts:[ … ] }
       LGTT.setPosts([{ id:'a1', u:'bmn', cap:'…', music:'…', dur:15, src:'https://…/video.mp4',
                        likes:0, comments:0, saves:0, shares:0 }])
       LGTT.setUser({ id:'abc', name:'Abc', handle:'abc', hue:200 })
     ===================================================================== -->
<style id="lgtt-styles">
/* =====================================================================
   1) STYLES — every selector is prefixed .lgtt / .lgtt-… so nothing here
      can leak into (or be overridden by) the rest of the website.
   ===================================================================== */

/* ---------- 1.0 Tokens (scoped to the module root) ---------- */
.lgtt, .lgtt-launch {
  --lg-fg: #fff;
  --lg-fg-2: rgba(255,255,255,.74);
  --lg-fg-3: rgba(255,255,255,.52);
  --lg-rose: #ff5c8a;            /* matches the site's --rose   */
  --lg-blue: #58aaff;            /* matches the site's --blue   */
  --lg-violet: #b18cff;          /* matches the site's --violet */
  --lg-cyan: #59f1e6;            /* matches the site's --cyan   */
  --lg-gold: #ffd166;
  --lg-live: #ff3b5c;
  --lg-blur: 26px;
  --lg-blur-sm: 14px;
  --lg-sat: 185%;
  --lg-stroke: rgba(255,255,255,.2);
  --lg-spec: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.07), inset 1px 0 0 rgba(255,255,255,.12);
  --lg-shadow: 0 18px 50px -14px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.25);
  --lg-spring: cubic-bezier(.34,1.45,.64,1);      /* springy overshoot */
  --lg-spring-soft: cubic-bezier(.22,1.18,.36,1); /* gentler overshoot */
  --lg-ease: cubic-bezier(.22,1,.36,1);
  --lg-col: min(460px, calc((var(--lgtt-vh, 100dvh) - 28px) * .5625));
  --lg-safe-t: env(safe-area-inset-top, 0px);
  --lg-safe-b: env(safe-area-inset-bottom, 0px);
  --lg-dock-space: calc(64px + 26px + var(--lg-safe-b));
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  letter-spacing: 0;
  line-height: 1.35;
  text-shadow: none;
}
.lgtt, .lgtt *, .lgtt *::before, .lgtt *::after,
.lgtt-launch, .lgtt-launch *, .lgtt-launch *::before, .lgtt-launch *::after { box-sizing: border-box; }
:where(.lgtt, .lgtt-launch) :where(button, input, textarea, select) {
  font: inherit; color: inherit; letter-spacing: inherit; margin: 0;
  -webkit-appearance: none; appearance: none; background: none; border: 0; border-radius: 0; outline: 0;
}
:where(.lgtt, .lgtt-launch) button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.lgtt [hidden], .lgtt-launch [hidden] { display: none !important; }
.lgtt :focus-visible, .lgtt-launch :focus-visible { outline: 2px solid var(--lg-cyan); outline-offset: 2px; }
.lgtt { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.lgtt input, .lgtt textarea, .lgtt .lgtt-cm-text, .lgtt .lgtt-bubble { -webkit-user-select: text; user-select: text; }
.lgtt input::placeholder, .lgtt textarea::placeholder { color: var(--lg-fg-3); }
.lgtt-ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.lgtt .on > .lgtt-ico.lgtt-fillable, .lgtt .is-on > .lgtt-ico.lgtt-fillable, .lgtt .lgtt-act-btn.on .lgtt-ico { fill: currentColor; }
html.lgtt-open { overflow: hidden !important; }
html.lgtt-open body { overscroll-behavior: none; }

/* ---------- 1.1 Liquid-glass material ---------- */
.lgtt-glass, .lgtt-glass-strong, .lgtt-glass-inset {
  background: linear-gradient(150deg, rgba(255,255,255,.16), rgba(255,255,255,.06) 55%, rgba(255,255,255,.1));
  -webkit-backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(1.06);
  backdrop-filter: blur(var(--lg-blur)) saturate(var(--lg-sat)) brightness(1.06);
  border: 1px solid var(--lg-stroke);
  box-shadow: var(--lg-spec), var(--lg-shadow);
}
.lgtt-glass-strong { background: linear-gradient(160deg, rgba(40,44,70,.62), rgba(18,20,34,.7)); --lg-blur: 38px; border-color: rgba(255,255,255,.16); }
.lgtt-glass-inset { background: rgba(255,255,255,.08); box-shadow: inset 0 1px 2px rgba(0,0,0,.25), inset 0 -1px 0 rgba(255,255,255,.1); backdrop-filter: none; -webkit-backdrop-filter: none; }
/* gradient "rim light" drawn only on the border via mask */
.lgtt-glass::before, .lgtt-glass-strong::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(140deg, rgba(255,255,255,.65), rgba(255,255,255,.08) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,.38));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .lgtt-glass { background: rgba(60,64,90,.78); } .lgtt-glass-strong { background: rgba(22,24,38,.95); }
}
.lgtt.is-lite { --lg-blur: 12px; --lg-blur-sm: 8px; --lg-sat: 140%; }

/* ---------- 1.2 Ultra-real buttons ---------- */
.lgtt-btn {
  --bleed: 255,255,255;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  color: #fff; overflow: hidden; isolation: isolate; text-decoration: none; white-space: nowrap;
  background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.07));
  border: 1px solid rgba(255,255,255,.24);
  -webkit-backdrop-filter: blur(var(--lg-blur-sm)) saturate(170%); backdrop-filter: blur(var(--lg-blur-sm)) saturate(170%);
  box-shadow: var(--lg-spec), 0 10px 24px -10px rgba(var(--bleed), .5), 0 2px 6px rgba(0,0,0,.28);
  transition: transform .38s var(--lg-spring), box-shadow .35s, background .35s, color .25s, border-color .3s;
  touch-action: manipulation;
}
.lgtt-btn::before { /* top specular sheen */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(255,255,255,0) 48%);
  opacity: .55; transition: opacity .3s;
}
.lgtt-btn::after { /* pointer-tracked reflection + colour bleed */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; opacity: 0; transition: opacity .3s;
  background:
    radial-gradient(90px circle at var(--mx, 35%) var(--my, 20%), rgba(255,255,255,.55), transparent 62%),
    radial-gradient(110px circle at var(--mx, 50%) calc(var(--my, 40%) + 38%), rgba(var(--bleed), .55), transparent 65%);
}
@media (hover: hover) {
  .lgtt-btn:hover { transform: scale(1.1); border-color: rgba(255,255,255,.4); box-shadow: var(--lg-spec), 0 14px 30px -8px rgba(var(--bleed), .7), 0 2px 6px rgba(0,0,0,.28); }
  .lgtt-btn:hover::after { opacity: 1; } .lgtt-btn:hover::before { opacity: .8; }
}
.lgtt-btn:active, .lgtt-btn.is-press { transform: scale(.9); transition-duration: .12s; }
.lgtt-btn:active::after, .lgtt-btn.is-press::after { opacity: 1; }
.lgtt-btn[disabled] { opacity: .5; pointer-events: none; }
.lgtt-round { width: 46px; height: 46px; border-radius: 50%; padding: 0; }
.lgtt-round.lgtt-lg { width: 52px; height: 52px; }
.lgtt-round.lgtt-sm { width: 40px; height: 40px; } .lgtt-round.lgtt-sm .lgtt-ico { width: 19px; height: 19px; }
.lgtt-round.lgtt-xs { width: 34px; height: 34px; } .lgtt-round.lgtt-xs .lgtt-ico { width: 18px; height: 18px; }
.lgtt-pill { height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 650; font-size: 14px; }
.lgtt-pill.lgtt-sm { height: 36px; padding: 0 14px; font-size: 13px; }
.lgtt-wide { width: 100%; }
.lgtt-primary { --bleed: 88,170,255; background: linear-gradient(135deg, rgba(70,150,255,.92), rgba(150,105,255,.92)); border-color: rgba(255,255,255,.42); }
.lgtt-danger { --bleed: 255,59,92; background: linear-gradient(135deg, rgba(255,59,92,.9), rgba(255,92,138,.9)); border-color: rgba(255,255,255,.4); }
.lgtt-is-like { --bleed: 255,45,111; } .lgtt-is-save { --bleed: 255,209,102; } .lgtt-is-cmt { --bleed: 89,241,230; } .lgtt-is-share { --bleed: 177,140,255; }
.lgtt-is-like.on { color: #ff4d7d; background: linear-gradient(160deg, rgba(255,77,125,.3), rgba(255,77,125,.1)); border-color: rgba(255,120,160,.55); box-shadow: var(--lg-spec), 0 0 28px -2px rgba(255,45,111,.65), 0 2px 6px rgba(0,0,0,.28); }
.lgtt-is-save.on { color: var(--lg-gold); background: linear-gradient(160deg, rgba(255,209,102,.3), rgba(255,209,102,.1)); border-color: rgba(255,220,140,.55); box-shadow: var(--lg-spec), 0 0 28px -2px rgba(255,209,102,.6); }
.lgtt-pop .lgtt-ico { animation: lgttPop .55s var(--lg-spring); }

/* ---------- 1.3 Avatar ---------- */
.lgtt-avatar {
  --h: 220; position: relative; display: inline-grid; place-items: center; flex: none;
  width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .02em;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.5), transparent 45%), linear-gradient(135deg, hsl(var(--h) 82% 62%), hsl(calc(var(--h) + 55) 80% 46%));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(0,0,0,.2), 0 2px 8px rgba(0,0,0,.3);
  text-shadow: 0 1px 3px rgba(0,0,0,.3); overflow: hidden;
}
.lgtt-avatar.lgtt-xs { width: 28px; height: 28px; font-size: 10px; } .lgtt-avatar.lgtt-sm { width: 38px; height: 38px; font-size: 13px; }
.lgtt-avatar.lgtt-lg { width: 92px; height: 92px; font-size: 30px; } .lgtt-avatar.lgtt-md { width: 52px; height: 52px; font-size: 17px; }

/* ---------- 1.4 Root overlay + stage ---------- */
.lgtt {
  position: fixed; left: 0; right: 0; top: var(--lgtt-vt, 0px); height: var(--lgtt-vh, 100dvh); z-index: 10300;
  display: flex; align-items: center; justify-content: center; color: var(--lg-fg);
  background: rgba(3,5,12,.78); -webkit-backdrop-filter: blur(36px) saturate(150%); backdrop-filter: blur(36px) saturate(150%);
  opacity: 0; visibility: hidden; transition: opacity .4s var(--lg-ease), visibility 0s linear .4s;
  overscroll-behavior: none; overflow: hidden; overflow: clip; touch-action: none;
}
.lgtt.is-open { opacity: 1; visibility: visible; transition-delay: 0s; }
.lgtt-ambient { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lgtt-ambient i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(90px); opacity: .5; background: #4a6cff; transition: background-color 1.1s ease; will-change: transform; }
.lgtt-ambient i:nth-child(1) { left: -22vmax; top: -24vmax; animation: lgttAmb 22s ease-in-out infinite alternate; }
.lgtt-ambient i:nth-child(2) { right: -24vmax; bottom: -26vmax; animation: lgttAmb 26s ease-in-out -8s infinite alternate-reverse; }
.lgtt-ambient i:nth-child(3) { left: 30%; top: 25%; width: 40vmax; height: 40vmax; opacity: .3; animation: lgttAmb 30s ease-in-out -14s infinite alternate; }
.lgtt-outer-close { position: absolute; top: calc(var(--lg-safe-t) + 16px); right: 18px; z-index: 5; display: none; }
.lgtt-stage {
  position: relative; width: min(var(--lg-col), 100%); height: 100%; max-height: 100%; overflow: hidden; overflow: clip; isolation: isolate;
  background: #05060d; color: #fff; transform-origin: 50% 60%;
  transition: width .7s var(--lg-spring-soft), border-radius .5s;
}
.lgtt.is-open .lgtt-stage { animation: lgttIn .75s var(--lg-spring) both; }
@media (min-width: 600px) {
  .lgtt-stage { height: calc(100% - 28px); border-radius: 36px; box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 50px 120px -20px rgba(0,0,0,.75), 0 0 80px -20px rgba(120,150,255,.35); }
  .lgtt-outer-close { display: inline-flex; }
}
@media (min-width: 980px) and (min-height: 560px) { .lgtt-stage[data-view="profile"] { width: min(1060px, calc(100% - 56px)); } }
.lgtt.is-standalone .lgtt-outer-close, .lgtt.is-standalone [data-act="close"] { display: none !important; }

/* ---------- 1.5 Views ---------- */
.lgtt-view { position: absolute; inset: 0; opacity: 1; transform: none; transition: opacity .45s var(--lg-ease), transform .6s var(--lg-spring-soft), filter .45s; }
.lgtt-view[hidden] { display: block !important; opacity: 0; visibility: hidden; pointer-events: none; transform: scale(.96) translateY(10px); filter: blur(6px); }
.lgtt-scroll {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-y;
  padding: calc(var(--lg-safe-t) + 12px) 14px calc(var(--lg-dock-space) + 8px);
  background: radial-gradient(120% 60% at 50% 0%, rgba(110,130,255,.16), transparent 60%), rgba(8,10,20,.72);
  -webkit-overflow-scrolling: touch;
}
.lgtt-scroll::-webkit-scrollbar { display: none; }
.lgtt-page-h h2 { margin: 6px 4px 12px; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.lgtt-sec { margin: 22px 6px 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--lg-fg-3); }

/* ---------- 1.6 Search field ---------- */
.lgtt-search { position: relative; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 12px; border-radius: 16px; }
.lgtt-search .lgtt-ico { width: 18px; height: 18px; color: var(--lg-fg-3); }
.lgtt-search input { flex: 1; min-width: 0; height: 100%; font-size: 16px; }
.lgtt-search input::-webkit-search-cancel-button { display: none; }
.lgtt-search input:focus-visible, .lgtt-compose-pill input:focus-visible, .lgtt-share-send input:focus-visible { outline: 0; }
.lgtt-search:focus-within { box-shadow: inset 0 1px 2px rgba(0,0,0,.25), 0 0 0 2px rgba(89,241,230,.65); }
.lgtt-compose-pill:focus-within { box-shadow: var(--lg-spec), 0 0 0 2px rgba(130,170,255,.55), 0 20px 44px -14px rgba(0,0,0,.8); }
.lgtt-search-meta { font-size: 11px; font-weight: 600; color: var(--lg-gold); white-space: nowrap; }
.lgtt-clear { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.16); flex: none; transition: transform .3s var(--lg-spring); }
.lgtt-clear:active { transform: scale(.8); } .lgtt-clear .lgtt-ico { width: 14px; height: 14px; color: #fff; }

/* ---------- 1.7 Segmented control ---------- */
.lgtt-seg { position: relative; display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 1px 3px rgba(0,0,0,.3); }
.lgtt-seg button { position: relative; z-index: 1; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 650; color: var(--lg-fg-2); transition: color .25s, transform .3s var(--lg-spring); white-space: nowrap; }
.lgtt-seg button.on { color: #fff; } .lgtt-seg button:active { transform: scale(.94); }
.lgtt-seg-ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: var(--x, 3px); width: var(--w, 60px); border-radius: 999px; background: linear-gradient(160deg, rgba(255,255,255,.34), rgba(255,255,255,.16)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 12px -4px rgba(0,0,0,.45); transition: left .55s var(--lg-spring), width .55s var(--lg-spring); }
.lgtt-seg-wide { display: flex; margin: 0 14px 6px; } .lgtt-seg-wide button { flex: 1; padding: 9px 4px; }

/* ---------- 1.8 FEED: pager, slides, scenes ---------- */
.lgtt-feed { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: #05060d; perspective: 1200px; cursor: grab; outline: 0; }
.lgtt-feed.is-drag { cursor: grabbing; }
.lgtt-track { position: absolute; inset: 0; }
.lgtt-slide { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; will-change: transform, opacity; visibility: hidden; contain: layout paint; transform-origin: 50% 50%; }
.lgtt-media, .lgtt-scene, .lgtt-vid { position: absolute; inset: 0; width: 100%; height: 100%; }
.lgtt-vid { object-fit: cover; background: #000; }
.lgtt-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 22%, transparent 48%, rgba(0,0,0,.72) 100%); }

/* Generative "video" scenes — pure CSS, no network needed. Swap in a real <video> by giving a post a `src`. */
.lgtt-scene { --sa: #1b1f4b; --sb: #4b2a8f; --sc: #ff5c8a; background: linear-gradient(165deg, var(--sa), var(--sb) 58%, var(--sc)); overflow: hidden; }
.lgtt-scene .bl { position: absolute; width: 90%; aspect-ratio: 1; border-radius: 50%; opacity: .8; mix-blend-mode: screen; animation: lgttDrift 13s ease-in-out infinite alternate; }
.lgtt-scene .bl.b1 { left: -25%; top: -10%; background: radial-gradient(circle, var(--sc), transparent 64%); }
.lgtt-scene .bl.b2 { right: -35%; top: 28%; background: radial-gradient(circle, color-mix(in srgb, var(--sb) 55%, #fff), transparent 64%); animation-delay: -5s; animation-duration: 17s; }
.lgtt-scene .bl.b3 { left: 5%; bottom: -30%; background: radial-gradient(circle, var(--sa), transparent 66%); animation-delay: -9s; }
.lgtt-scene .glyph { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: min(34vw, 150px); line-height: 1; filter: drop-shadow(0 18px 30px rgba(0,0,0,.4)); animation: lgttFloat 5.5s ease-in-out infinite; }
.lgtt-scene .kin { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-weight: 900; font-size: min(15vw, 64px); letter-spacing: .02em; text-transform: uppercase; color: rgba(255,255,255,.9); mix-blend-mode: overlay; pointer-events: none; }
.lgtt-scene .kin span { position: absolute; left: 0; right: 0; opacity: 0; animation: lgttKin 6s steps(1) infinite; }
.lgtt-scene .kin span:nth-child(2) { animation-delay: 2s; } .lgtt-scene .kin span:nth-child(3) { animation-delay: 4s; }
.lgtt-scene .tc { position: absolute; left: 16px; top: calc(var(--lg-top-h, 130px) + 14px); font: 700 10.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; color: rgba(255,255,255,.72); display: flex; align-items: center; gap: 6px; }
.lgtt-scene .tc i { width: 7px; height: 7px; border-radius: 50%; background: var(--lg-live); animation: lgttBlink 1.2s steps(2) infinite; }
/* scene kinds */
.lgtt-scene.k-grid .floor { position: absolute; left: -60%; right: -60%; bottom: -2%; height: 56%; transform: perspective(280px) rotateX(64deg); transform-origin: 50% 100%; background: linear-gradient(var(--sc) 2px, transparent 2px) 0 0 / 100% 46px, linear-gradient(90deg, var(--sc) 2px, transparent 2px) 0 0 / 46px 100%; opacity: .75; animation: lgttGrid 1.4s linear infinite; -webkit-mask: linear-gradient(transparent, #000 55%); mask: linear-gradient(transparent, #000 55%); }
.lgtt-scene.k-grid .sun { position: absolute; left: 50%; bottom: 36%; width: 56%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: linear-gradient(180deg, #ffe08a, var(--sc)); opacity: .9; -webkit-mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px); mask: repeating-linear-gradient(180deg, #000 0 14px, transparent 14px 20px); }
.lgtt-scene.k-rings .rg { position: absolute; left: 50%; top: 42%; width: 40%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); transform: translate(-50%, -50%) scale(.2); opacity: 0; animation: lgttRing 4s ease-out infinite; }
.lgtt-scene.k-rings .rg:nth-child(2) { animation-delay: 1s; } .lgtt-scene.k-rings .rg:nth-child(3) { animation-delay: 2s; } .lgtt-scene.k-rings .rg:nth-child(4) { animation-delay: 3s; }
.lgtt-scene.k-bars .eq { position: absolute; left: 6%; right: 6%; bottom: 22%; height: 34%; display: flex; align-items: flex-end; gap: 3%; }
.lgtt-scene.k-bars .eq i { flex: 1; height: 100%; border-radius: 8px 8px 2px 2px; background: linear-gradient(180deg, #fff, var(--sc)); opacity: .85; transform-origin: 50% 100%; animation: lgttBar 1.1s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
.lgtt-scene.k-burst .rays { position: absolute; left: 50%; top: 42%; width: 190%; aspect-ratio: 1; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0 7deg, transparent 7deg 22deg); -webkit-mask: radial-gradient(circle, #000 5%, transparent 62%); mask: radial-gradient(circle, #000 5%, transparent 62%); animation: lgttSpin 40s linear infinite; }
.lgtt-slide:not(.is-active) .lgtt-scene *, .lgtt-slide.is-paused .lgtt-scene *, .lgtt-slide.is-paused .lgtt-disc, .lgtt-slide:not(.is-active) .lgtt-disc { animation-play-state: paused !important; }

/* Slide overlays */

.lgtt-cap-more { margin-top: 2px; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.75); }
.lgtt-music { margin-top: 9px; display: inline-flex; align-items: center; gap: 7px; max-width: 100%; padding: 6px 12px 6px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.12); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.2); overflow: hidden; }

.lgtt-music .mq span { display: inline-block; }

.lgtt-side { position: absolute; right: 10px; bottom: calc(var(--lg-dock-space) + 18px); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 13px; }

.lgtt-av-wrap { position: relative; width: 56px; height: 62px; margin-bottom: 2px; }

.lgtt-disc .lgtt-avatar { width: 24px; height: 24px; font-size: 0; } .lgtt-disc::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #05060d; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
/* scrubber */

.lgtt-prog:hover .lgtt-prog-track, .lgtt-prog.is-seek .lgtt-prog-track { height: 8px; } .lgtt-prog:hover .lgtt-prog-thumb, .lgtt-prog.is-seek .lgtt-prog-thumb { transform: scale(1); }
.lgtt-prog-time { position: absolute; right: 0; bottom: 20px; font: 700 11px/1 ui-monospace, Menlo, monospace; color: #fff; opacity: 0; transition: opacity .25s; text-shadow: 0 1px 4px #000; }
.lgtt-prog.is-seek .lgtt-prog-time { opacity: 1; }
/* double-tap heart burst */
.lgtt-burst { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; pointer-events: none; z-index: 8; }
.lgtt-burst .h { position: absolute; inset: 0; color: #ff4d7d; filter: drop-shadow(0 6px 22px rgba(255,45,111,.85)); animation: lgttHeart .95s var(--lg-spring) forwards; } .lgtt-burst .h svg { width: 100%; height: 100%; fill: currentColor; stroke: none; }
.lgtt-burst .p { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; color: #ff8fb0; opacity: 0; animation: lgttPart .85s var(--lg-ease) forwards; animation-delay: .05s; } .lgtt-burst .p svg { width: 100%; height: 100%; fill: currentColor; stroke: none; }

/* ---------- 1.9 Top bar: tabs + stories ---------- */

.lgtt-stories { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 2px 8px; scrollbar-width: none; scroll-snap-type: x proximity; overscroll-behavior-x: contain; touch-action: pan-x; }
.lgtt-stories::-webkit-scrollbar { display: none; }
.lgtt-story-item { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; scroll-snap-align: start; color: inherit; transition: transform .4s var(--lg-spring); }

.lgtt-pulse { position: absolute; inset: -1px; border-radius: 50%; border: 2px solid rgba(255,59,92,.8); pointer-events: none; animation: lgttLiveRing 1.9s var(--lg-ease) infinite; box-shadow: 0 0 14px rgba(255,59,92,.6), inset 0 0 12px rgba(255,59,92,.35); }

.lgtt-plus { position: absolute; right: 2px; bottom: 2px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--lg-blue), var(--lg-violet)); border: 2px solid #12141f; } .lgtt-plus .lgtt-ico { width: 11px; height: 11px; stroke-width: 3.4; }

/* ---------- 1.10 Floating dock ---------- */
.lgtt-dock { position: absolute; left: 50%; bottom: calc(12px + var(--lg-safe-b)); z-index: 30; width: min(380px, calc(100% - 28px)); height: 66px; margin-left: calc(min(380px, 100% - 28px) / -2); display: flex; align-items: stretch; padding: 6px; border-radius: 34px; transition: transform .7s var(--lg-spring), opacity .35s; }
.lgtt-dock-lens { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 5); border-radius: 28px; background: linear-gradient(150deg, rgba(120,190,255,.38), rgba(190,150,255,.28)); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 14px rgba(120,160,255,.18), 0 8px 22px -6px rgba(90,160,255,.7); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .65s var(--lg-spring); }
.lgtt-dk { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--lg-fg-2); font-size: 10px; font-weight: 650; border-radius: 28px; transition: color .3s, transform .45s var(--lg-spring); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.lgtt-plus-pill::before, .lgtt-plus-pill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 100%; border-radius: 12px; z-index: -1; transition: transform .45s var(--lg-spring); }
.lgtt-plus-pill::before { left: -4px; background: var(--lg-cyan); box-shadow: 0 0 16px rgba(89,241,230,.6); } .lgtt-plus-pill::after { right: -4px; background: var(--lg-rose); box-shadow: 0 0 16px rgba(255,92,138,.6); }
.lgtt-plus-pill .lgtt-ico { width: 20px; height: 20px; stroke-width: 3; }
@media (hover: hover) { .lgtt-dk-plus:hover .lgtt-plus-pill { transform: scale(1.1); } .lgtt-dk-plus:hover .lgtt-plus-pill::before { transform: translateX(-3px); } .lgtt-dk-plus:hover .lgtt-plus-pill::after { transform: translateX(3px); } }
.lgtt-badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #ff3b5c, #ff6a88); border: 1.5px solid rgba(20,22,36,.9); box-shadow: 0 2px 10px rgba(255,59,92,.7); font-style: normal; animation: lgttPop .6s var(--lg-spring); }
.lgtt-stage.has-layer .lgtt-dock { transform: translateY(160%); opacity: 0; pointer-events: none; }
.lgtt-stage[data-view="profile"] .lgtt-dock, .lgtt-stage[data-view="discover"] .lgtt-dock { /* keep dock above scrolling lists */ }

/* ---------- 1.11 Layers: scrim, sheets, slide-overs, modals ---------- */
.lgtt-scrim { position: absolute; inset: 0; z-index: 35; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .45s var(--lg-ease); }

.lgtt-sheet { position: absolute; left: 8px; right: 8px; bottom: calc(8px + var(--lg-safe-b)); z-index: 40; max-height: min(86%, 760px); display: flex; flex-direction: column; border-radius: 32px; overflow: hidden; transform: translateY(calc(100% + 40px)); visibility: hidden; transition: transform .7s var(--lg-spring), visibility 0s linear .7s; will-change: transform; }

#lgttComments { height: min(78%, 740px); }

.lgtt-sheet-body::-webkit-scrollbar { display: none; }
.lgtt-sheet .lgtt-search { margin: 0 14px 6px; }
.lgtt-over { position: absolute; inset: 0; z-index: 45; display: flex; flex-direction: column; background: radial-gradient(120% 50% at 50% 0%, rgba(110,130,255,.18), transparent 60%), rgba(9,11,22,.93); -webkit-backdrop-filter: blur(44px) saturate(180%); backdrop-filter: blur(44px) saturate(180%); transform: translateX(105%); visibility: hidden; transition: transform .7s var(--lg-spring-soft), visibility 0s linear .7s; will-change: transform; }

.lgtt-menu { position: relative; width: min(280px, 100%); border-radius: 26px; overflow: hidden; padding: 6px; transform: scale(.86); transition: transform .6s var(--lg-spring); }
.lgtt-menu button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border-radius: 20px; font-size: 15.5px; font-weight: 600; text-align: left; transition: background .2s, transform .35s var(--lg-spring); }
.lgtt-menu button:active { background: rgba(255,255,255,.14); transform: scale(.97); } .lgtt-menu button.danger { color: #ff6b86; } .lgtt-menu button .lgtt-ico { width: 19px; height: 19px; opacity: .85; }

.lgtt-stage.has-layer .lgtt-mute { transform: scale(.0); }

/* ---------- 1.12 Toasts + haptic flash ---------- */
.lgtt-toasts { position: absolute; left: 0; right: 0; top: calc(var(--lg-safe-t) + 14px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.lgtt-toast { position: relative; display: inline-flex; align-items: center; gap: 9px; max-width: calc(100% - 36px); padding: 11px 16px 11px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 650; background: linear-gradient(150deg, rgba(60,66,100,.75), rgba(24,26,44,.82)); -webkit-backdrop-filter: blur(26px) saturate(190%); backdrop-filter: blur(26px) saturate(190%); border: 1px solid rgba(255,255,255,.2); box-shadow: var(--lg-spec), 0 14px 34px -10px rgba(0,0,0,.7); animation: lgttToastIn .6s var(--lg-spring) both; }

/* ---------- 1.13 Comments ---------- */
.lgtt-cm { display: flex; gap: 11px; padding: 10px 0; animation: lgttFadeUp .5s var(--lg-ease) both; animation-delay: calc(var(--n, 0) * 30ms); }

  <!-- =============== ROOT OVERLAY =============== -->
  <div class="lgtt" id="lgtt" hidden role="dialog" aria-modal="true" aria-label="BMN Reels — community video feed">

    <!-- Ambient colour bleed from the current video, blurred behind the stage -->
    <div class="lgtt-ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- Desktop-only close affordance outside the stage -->
    <button class="lgtt-outer-close lgtt-btn lgtt-round" type="button" data-act="close" aria-label="Close Reels"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button>

    <!-- The stage: phone-width column (widens for the Profile + BMN layout on desktop) -->
    <div class="lgtt-stage" id="lgttStage" data-view="feed">

      <!-- ============ VIEW: FEED ============ -->
      <section class="lgtt-view lgtt-v-feed" data-v="feed" aria-label="Video feed">
        <div class="lgtt-feed" id="lgttFeed" tabindex="-1">
          <div class="lgtt-track" id="lgttTrack"></div>
        </div>

        <!-- Top bar: tabs + stories (glass, floats over the video) -->
        <header class="lgtt-top" id="lgttTop">
          <div class="lgtt-top-row">
            <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="close" aria-label="Close Reels"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button>
            <div class="lgtt-tabs lgtt-glass" id="lgttTabs" role="tablist" aria-label="Feed">
              <i class="lgtt-tab-ind" aria-hidden="true"></i>
              <button type="button" role="tab" data-tab="following" aria-selected="false">Following</button>
              <button type="button" role="tab" data-tab="fyp" aria-selected="true" class="on">For You</button>
            </div>
            <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="goto-discover" aria-label="Search and discover"><svg class="lgtt-ico"><use href="#lgi-search"/></svg></button>
          </div>
          <div class="lgtt-stories-wrap lgtt-glass" id="lgttStoriesWrap">
            <div class="lgtt-stories" id="lgttStories" role="list" aria-label="Stories and live"></div>
          </div>
        </header>

        <!-- Sound toggle (floats under the top bar) -->
        <button class="lgtt-btn lgtt-round lgtt-sm lgtt-mute" id="lgttMute" type="button" data-act="mute" aria-label="Toggle sound" aria-pressed="false"><svg class="lgtt-ico"><use href="#lgi-vol"/></svg></button>

        <!-- One-time swipe hint -->
        <div class="lgtt-hint" id="lgttHint" aria-hidden="true"><svg class="lgtt-ico"><use href="#lgi-chev-u"/></svg><span>Swipe up</span></div>
      </section>

      <!-- ============ VIEW: DISCOVER ============ -->
      <section class="lgtt-view lgtt-v-discover" data-v="discover" aria-label="Discover" hidden>
        <div class="lgtt-scroll" id="lgttDiscScroll">
          <header class="lgtt-page-h">
            <h2>Discover</h2>
            <div class="lgtt-search lgtt-glass">
              <svg class="lgtt-ico"><use href="#lgi-search"/></svg>
              <input id="lgttDiscSearch" type="search" placeholder="Search edits, creators, #tags" aria-label="Search videos" autocomplete="off" enterkeyhint="search">
              <button type="button" class="lgtt-clear" data-act="disc-clear" aria-label="Clear search" hidden><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button>
            </div>
          </header>
          <div class="lgtt-chips" id="lgttChips" role="list"></div>
          <h3 class="lgtt-sec">Creators to follow</h3>
          <div class="lgtt-creators" id="lgttCreators"></div>
          <h3 class="lgtt-sec" id="lgttDiscTitle">Trending now</h3>
          <div class="lgtt-disc-grid" id="lgttDiscGrid"></div>
        </div>
      </section>

      <!-- ============ VIEW: PROFILE (+ anchored BMN Page) ============ -->
      <section class="lgtt-view lgtt-v-profile" data-v="profile" aria-label="Profile" hidden>
        <div class="lgtt-scroll" id="lgttProfScroll">
          <header class="lgtt-prof-bar lgtt-glass" id="lgttProfBar">
            <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="prof-back" aria-label="Back to feed"><svg class="lgtt-ico"><use href="#lgi-chev-l"/></svg></button>
            <strong id="lgttProfBarTitle">Profile</strong>
            <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="open-settings" id="lgttProfMenu" aria-label="Open account and privacy settings"><svg class="lgtt-ico"><use href="#lgi-menu"/></svg></button>
          </header>
          <div class="lgtt-prof-layout" id="lgttProfLayout">
            <div class="lgtt-prof-head lgtt-glass" id="lgttProfHead"></div>
            <aside class="lgtt-bmn lgtt-glass" id="lgttBmn" aria-label="BMN Page"></aside>
            <div class="lgtt-prof-tabs lgtt-glass" id="lgttProfTabs" role="tablist"></div>
            <div class="lgtt-prof-grid" id="lgttProfGrid"></div>
          </div>
        </div>
      </section>

      <!-- ============ FLOATING DOCK ============ -->
      <nav class="lgtt-dock lgtt-glass" id="lgttDock" aria-label="Reels navigation">
        <i class="lgtt-dock-lens" id="lgttLens" aria-hidden="true"></i>
        <button type="button" class="lgtt-dk on" data-dock="feed"><svg class="lgtt-ico"><use href="#lgi-home"/></svg><span>Home</span></button>
        <button type="button" class="lgtt-dk" data-dock="discover"><svg class="lgtt-ico"><use href="#lgi-compass"/></svg><span>Discover</span></button>
        <button type="button" class="lgtt-dk lgtt-dk-plus" data-dock="create" aria-label="Create"><span class="lgtt-plus-pill"><svg class="lgtt-ico"><use href="#lgi-plus"/></svg></span></button>
        <button type="button" class="lgtt-dk" data-dock="inbox"><svg class="lgtt-ico"><use href="#lgi-mail"/></svg><span>Inbox</span><b class="lgtt-badge" id="lgttInboxBadge" hidden>0</b></button>
        <button type="button" class="lgtt-dk" data-dock="profile"><svg class="lgtt-ico"><use href="#lgi-user"/></svg><span>Profile</span></button>
      </nav>

      <!-- ============ LAYERS (sheets, slide-overs, modals) ============ -->
      <div class="lgtt-scrim" id="lgttScrim"></div>

      <!-- Comments drawer + comment search -->
      <aside class="lgtt-sheet lgtt-glass-strong" id="lgttComments" data-layer="comments" aria-hidden="true" role="dialog" aria-label="Comments" inert>
        <div class="lgtt-grab" aria-hidden="true"></div>
        <header class="lgtt-sheet-h">
          <div><h3 id="lgttCmtTitle">Comments</h3><small id="lgttCmtCount"></small></div>
          <div class="lgtt-seg" id="lgttCmtSort" role="tablist" aria-label="Sort comments">
            <i class="lgtt-seg-ind"></i>
            <button type="button" data-sort="top" class="on" role="tab" aria-selected="true">Top</button>
            <button type="button" data-sort="new" role="tab" aria-selected="false">Newest</button>
          </div>
          <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="close-layer" aria-label="Close comments"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button>
        </header>
        <div class="lgtt-search lgtt-glass-inset" role="search">
          <svg class="lgtt-ico"><use href="#lgi-search"/></svg>
          <input id="lgttCmtSearch" type="search" placeholder="Search keywords in comments…" aria-label="Search comments" autocomplete="off" enterkeyhint="search">
          <span class="lgtt-search-meta" id="lgttCmtMeta" aria-live="polite"></span>
          <button type="button" class="lgtt-clear" data-act="cmt-clear" aria-label="Clear comment search" hidden><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button>
        </div>
        <div class="lgtt-sheet-body" id="lgttCmtList"></div>
        <footer class="lgtt-composer">
          <div class="lgtt-reply-chip" id="lgttReplyChip" hidden><span></span><button type="button" data-act="cmt-cancel-reply" aria-label="Cancel reply"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button></div>
          <div class="lgtt-emoji-row" id="lgttEmojiRow"></div>
          <form class="lgtt-compose-pill lgtt-glass" id="lgttCmtForm" autocomplete="off">
            <span class="lgtt-avatar lgtt-xs" id="lgttCmtMe"></span>
            <input id="lgttCmtInput" type="text" maxlength="200" placeholder="Add comment…" aria-label="Add a comment" enterkeyhint="send">
            <button type="submit" class="lgtt-send" aria-label="Post comment" disabled><svg class="lgtt-ico"><use href="#lgi-send"/></svg></button>
          </form>
        </footer>
      </aside>

      <!-- Share tray -->
      <aside class="lgtt-sheet lgtt-glass-strong" id="lgttShare" data-layer="share" aria-hidden="true" role="dialog" aria-label="Share" inert>
        <div class="lgtt-grab" aria-hidden="true"></div>
        <header class="lgtt-sheet-h"><div><h3>Share to</h3><small id="lgttShareSub"></small></div>
          <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="close-layer" aria-label="Close share"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button></header>
        <div class="lgtt-sheet-body lgtt-share-body">
          <div class="lgtt-share-people" id="lgttSharePeople"></div>
          <div class="lgtt-share-channels" id="lgttShareChannels"></div>
          <div class="lgtt-share-actions" id="lgttShareActions"></div>
        </div>
        <div class="lgtt-share-send lgtt-glass" id="lgttShareSend" hidden>
          <input id="lgttShareMsg" type="text" placeholder="Add a message…" aria-label="Message" maxlength="120">
          <button type="button" class="lgtt-btn lgtt-pill lgtt-primary" data-act="share-send"><svg class="lgtt-ico"><use href="#lgi-send"/></svg><span>Send</span></button>
        </div>
      </aside>

      <!-- Create sheet -->
      <aside class="lgtt-sheet lgtt-glass-strong" id="lgttCreate" data-layer="create" aria-hidden="true" role="dialog" aria-label="Create" inert>
        <div class="lgtt-grab" aria-hidden="true"></div>
        <header class="lgtt-sheet-h"><div><h3>Create</h3><small>Share something with the BMN Community</small></div>
          <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="close-layer" aria-label="Close"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button></header>
        <div class="lgtt-sheet-body" id="lgttCreateBody"></div>
      </aside>

      <!-- Text-story composer -->
      <aside class="lgtt-sheet lgtt-glass-strong" id="lgttStoryComposer" data-layer="storycomposer" aria-hidden="true" role="dialog" aria-label="Create a story" inert>
        <div class="lgtt-grab" aria-hidden="true"></div>
        <header class="lgtt-sheet-h"><div><h3>New story</h3><small>Visible for this session</small></div>
          <button class="lgtt-btn lgtt-round lgtt-sm" type="button" data-act="close-layer" aria-label="Close"><svg class="lgtt-ico"><use href="#lgi-x"/></svg></button></header>
        <div class="lgtt-sheet-body">
          <div class="lgtt-story-preview" id="lgttSpPreview"><textarea id="lgttSpText" maxlength="120" placeholder="Type something…" aria-label="Story text"></textarea></div>
          <div class="lgtt-swatches" id="lgttSpSwatches" role="radiogroup" aria-label="Background"></div>

    const gap = n > 1 ? 6 : 0, len = C / n - gap;
    for (let i = 0; i < n; i++) out += '<circle class="seg' + (i < seen ? ' seen' : '') + '" cx="32" cy="32" r="29" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" transform="rotate(' + (-90 + i * 360 / n + gap / 2 / C * 360).toFixed(2) + ' 32 32)"/>';
    return out + '</svg>';
  }

          '<span class="lgtt-avatar-wrap">' + (s.live ? '<i class="lgtt-pulse"></i><i class="lgtt-pulse p2"></i>' : '') + ringSVG(s.live ? 1 : n, seen) + avatar(u) +

        return;
      }
      const story = t.closest('[data-story]'); if (story) { haptic('tap'); Stories.openUser(story.dataset.story); return; }
      const tabBtn = t.closest('[data-tab]'); if (tabBtn && tabBtn.closest('#lgttTabs')) { Feed.setMode(tabBtn.dataset.tab); return; }
      const a = t.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act, slide = a.closest('.lgtt-slide'), post = slide && slide._post;
      switch (act) {
        case 'close': Overlay.close(); break;
        case 'close-layer': { const L = a.closest('[data-layer]'); if (L) closeLayer(L); break; }
        case 'goto-discover': Views.set('discover'); break;
        case 'mute': S.settings.sound = !S.settings.sound; save(); applySettings(); wobble(R.Mute, { amp: 1.5, rot: 6 }); toast(S.settings.sound ? 'Sound on' : 'Sound off', S.settings.sound ? 'vol' : 'mute'); break;
        case 'like': post && Feed.setLike(post, !S.liked[baseId(post.id)]); break;
        case 'comment': post && Comments.open(post); break;
        case 'save': post && Feed.toggleSave(post); break;
        case 'share': post && Share.open(post); break;
        case 'follow': Feed.follow(a.dataset.u); break;
        case 'open-profile': Views.set('profile', a.dataset.u); break;
        case 'tag': Views.set('discover'); Discover.search('#' + a.dataset.tag); break;
        case 'cap-more': { const cap = $('.lgtt-cap', slide); const o = cap.classList.toggle('is-open'); a.textContent = o ? 'less' : 'more'; break; }
        case 'tab': Feed.setMode(a.dataset.tab); break;
        case 'tile': Views.set('feed'); Feed.openPost(a.dataset.id); break;
        case 'disc-clear': Discover.clear(); break;
        case 'cmt-clear': Comments.clearSearch(); break;
        case 'cmt-cancel-reply': Comments.cancelReply(); break;
        case 'share-send': Share.send(); break;
        case 'story-post': Stories.post(); break;
        case 'story-prev': if (!Stories.shouldSuppress()) Stories.prev(); break;
        case 'story-next': if (!Stories.shouldSuppress()) Stories.next(); break;
        case 'story-pause': Stories.togglePause(); break;
        case 'story-like': Stories.like(); break;
        case 'story-profile': { const u = Stories.userId(); closeAllLayers(); u && Views.set('profile', u); break; }
        case 'live-heart': Live.heart(); break;
        case 'live-profile': { const u = Live.userId(); closeAllLayers(); u && Views.set('profile', u); break; }
        case 'open-settings': Settings.open(); break;
        case 'prof-back': Views.set(Views.prev && Views.prev !== 'profile' ? Views.prev : 'feed'); break;
        case 'edit-profile': Edit.open(); break;
        case 'share-profile': { const url = location.href.split('#')[0] + '#profile-' + Profile.user().handle; copyText(url).then(() => { toast('Profile link copied', 'link'); haptic('success'); }); break; }
        case 'message': Dm.openWith(a.dataset.u); break;
        case 'open-bmn': openBmnPage(); break;
        case 'dm-new': Dm.newChat(); break;
        case 'chat-profile': { const c = Dm.current(); if (c) { closeAllLayers(); Views.set('profile', c.u); } break; }
        case 'chat-heart': Dm.heart(); break;
        case 'chat-attach': toast('Attachments are not wired in this module', 'info'); break;
        case 'chat-more': Menu.open([{ label: 'View profile', icon: 'user', fn: () => { const c = Dm.current(); if (c) { closeAllLayers(); Views.set('profile', c.u); } } }, { label: 'Clear chat', icon: 'trash', fn: () => Dm.clear() }, '-', { label: 'Block', icon: 'ban', danger: true, fn: () => Confirm.ask('Block this account?', 'They will not be able to message you or see your videos.', 'Block', () => { const c = Dm.current(); if (c) { S.blocked.push(userFor(c.u).handle); save(); toast('Blocked', 'ban'); closeLayer(R.Chat); } }, true) }]); break;
      }
    }

    /** "Open BMN Page": closes the overlay and uses the site's own BMN/Community switch so routing stays native. */
    function openBmnPage() {
      Overlay.close();
      setTimeout(() => { const b = $('.view-switch [data-view="personal"]') || $('[data-view="personal"]'); if (b) b.click(); else location.hash = '#home'; }, 420);
    }

    function bindEvents() {
      R.root.addEventListener('click', e => {
        onClick(e);
        const b = e.target.closest('.lgtt-btn, .lgtt-chip, .lgtt-create-opt, .lgtt-thread, .lgtt-creator, .lgtt-chan');
        if (b && !b.closest('.lgtt-dock')) wobble(b, { amp: 0.7, rot: 1.4 });
        const dk = e.target.closest('.lgtt-dk'); if (dk) wobble(dk, { amp: 0.9, rot: 2, lift: 3 });
      });
      // haptic tap on every button press (components that need a special pattern opt out with data-haptic="none")
      R.root.addEventListener('pointerdown', e => {
        const b = e.target.closest('button,[role="button"],a,.lgtt-tile');
        if (b && b.dataset.haptic !== 'none' && !b.closest('.lgtt-story-zone')) haptic('tap');
        const g = e.target.closest('.lgtt-btn'); if (g) { const r = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px'); g.classList.add('is-press'); }
      }, true);
      const rel = () => $$('.is-press', R.root).forEach(x => x.classList.remove('is-press'));
      ['pointerup', 'pointercancel', 'dragstart'].forEach(ev => R.root.addEventListener(ev, rel, true));
      let mv = 0;                                                  // pointer-tracked glass reflection
      R.root.addEventListener('pointermove', e => {
        if (mv || e.pointerType === 'touch') return; const g = e.target.closest && e.target.closest('.lgtt-btn'); if (!g) return;
        mv = requestAnimationFrame(() => { mv = 0; const r = g.getBoundingClientRect(); g.style.setProperty('--mx', (e.clientX - r.left) + 'px'); g.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
      }, { passive: true });
      R.Scrim.addEventListener('click', () => { haptic('tick'); closeTop(); });
      R.Confirm.addEventListener('click', e => { if (e.target === R.Confirm) closeLayer(R.Confirm); });
      R.Menu.addEventListener('click', e => { if (e.target === R.Menu) closeLayer(R.Menu); });
      document.addEventListener('keydown', onKey, true);
      $('#lgttMute').addEventListener('keydown', e => e.stopPropagation());
    }

    function onKey(e) {
      if (!ST.open) return;
      const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
      if (e.key === 'Escape') {
        e.stopPropagation();
        if (typing && t.type === 'search' && t.value) return;
        if (!closeTop()) { if (ST.view !== 'feed') Views.set('feed'); else Overlay.close(); } return;
      }
      if (e.key === 'Tab') {                                       // keep focus inside the overlay (simple trap)
        const scope = topLayer() ? topLayer().el : R.stage;
        const f = $$('button:not([disabled]),input:not([disabled]),textarea,a[href],[tabindex="0"]', scope).filter(n => n.offsetParent !== null && !n.closest('[hidden],[inert]'));
        if (!f.length) return; const i = f.indexOf(document.activeElement);
        if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === f.length - 1)) { e.preventDefault(); f[e.shiftKey ? f.length - 1 : 0].focus(); }
        return;
      }
      if (typing || ST.view !== 'feed' || stack.length) return;
      const cur = Feed.cur(), p = cur && cur._post; let handled = true;
      switch (e.key) {
        case 'ArrowDown': case 'j': case 'J': Feed.go(1); break;
        case 'ArrowUp': case 'k': case 'K': Feed.go(-1); break;
        case ' ': Feed.togglePlay(true); break;
        case 'l': case 'L': p && Feed.setLike(p, !S.liked[baseId(p.id)]); break;
        case 'b': case 'B': p && Feed.toggleSave(p); break;
        case 'c': case 'C': p && Comments.open(p); break;
        case 's': case 'S': p && Share.open(p); break;
        case 'm': case 'M': R.Mute.click(); break;
        default: handled = false;
      }
      if (handled) { e.preventDefault(); e.stopPropagation(); }
    }

    /* ---- launcher injected into the Community Page (never replaces anything) ---- */
    function injectLauncher() {
      const center = $('.community-center'); if (!center) return false;
      let l = $('#lgttLaunch');
      if (!l) { const t = $('#lgtt-tpl-launch'); if (!t) return false; center.appendChild(t.content.cloneNode(true)); l = $('#lgttLaunch'); }
      const tabs = $('#bmnFeedTabs', center);
      if (l.parentNode !== center || (tabs ? l.previousElementSibling !== tabs : center.firstElementChild !== l)) { tabs && tabs.nextSibling ? center.insertBefore(l, tabs.nextSibling) : center.insertBefore(l, tabs ? null : center.firstChild); }
      Stories.render();
      return true;
    }
    function watchLauncher() {
      const center = $('.community-center'); if (!center) return;
      let t = 0; new MutationObserver(() => { clearTimeout(t); t = setTimeout(() => { const l = $('#lgttLaunch'); if (!l || !l.isConnected || l.parentNode !== center) injectLauncher(); }, 200); }).observe(center, { childList: true });
    }

    function boot() {
      mount();
      const hasSite = !!($('.community-center') || $('#communityPage') || $('[data-view="community"]'));
      ST.standalone = CFG.mode === 'standalone' || (CFG.mode === 'auto' && !hasSite);
      if (ST.standalone) R.root.classList.add('is-standalone');
      if (!ST.standalone) { injectLauncher(); watchLauncher(); }
      document.addEventListener('click', e => {                    // any element can open Reels: <button data-lgtt-open="feed|discover|profile|inbox">
        const o = e.target.closest('[data-lgtt-open]'); if (o) { e.preventDefault(); Overlay.open({ view: o.dataset.lgttOpen || 'feed' }); return; }
        const s = e.target.closest('#lgttLaunch [data-story]'); if (s) { e.stopPropagation(); haptic('tap'); Overlay.open({ story: s.dataset.story }); }
      }, true);
      if (/^#reel-/.test(location.hash)) setTimeout(() => Overlay.open({ post: location.hash.slice(6) }), 400);
      else if (location.hash === '#reels') setTimeout(() => Overlay.open({}), 400);
      if (ST.standalone) Overlay.open({});
      // make sure indicator positions are right after fonts load
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => R.root && moveInd(R.Tabs));
    }
    return { boot, mount, applySettings, openBmnPage };
  })();

  /* ---------------------------------------------------------------
     Public API — window.LGTT
     --------------------------------------------------------------- */
  window.LGTT = {
    __mounted: true, version: '1.0.0',
    open: o => Overlay.open(typeof o === 'string' ? { view: o } : o), close: () => Overlay.close(),
    openStory: uid => Overlay.open({ story: uid }), openProfile: uid => Overlay.open({ view: 'profile', uid }), openInbox: () => Overlay.open({ view: 'inbox' }),
    /** Replace the demo videos: [{id,u:'bmn',cap,music,dur,likes,comments,saves,shares, src:'https://…mp4', scene:{…}}] */
    setPosts(arr) { if (!Array.isArray(arr) || !arr.length) return; POSTS = arr.map(p => Object.assign({ likes: 0, comments: 0, saves: 0, shares: 0, dur: 15, scene: SC.s1 }, p)); Feed.build(Feed.mode()); Discover.render(); },
    /** Add / update a creator: LGTT.setUser({id:'abc',name:'Abc',handle:'abc',hue:200,followers:10}) */
    setUser(u) { if (u && u.id) U[u.id] = Object.assign({ hue: 210, followers: 0, following: 0, likes: 0 }, U[u.id] || {}, u); },
    haptic: k => haptic(k), toast
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot); else App.boot();
})();

</script>
<!-- ===== END BMN LIQUID GLASS REELS MODULE ===== -->
</body>
